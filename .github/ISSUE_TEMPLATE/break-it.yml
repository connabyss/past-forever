name: Break it
description: Your calculator caught one of the two-minute dare's answers, or you found a wrong answer, a loop you can answer that Past Forever can't, a 10,000-digit liar, or a proof (or break) of the four magnets.
title: "Break it: "
labels: ["break-it"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What did you find?
      options:
        - "The two-minute dare: my calculator says one of its answers is wrong"
        - A wrong answer (it says "proved" and is wrong)
        - A loop it can't see the end of, but I can
        - The 10,000-digit liar, or a faster liar search
        - A proof or a break of the four magnets
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Your code
      description: Paste the Past Forever program, exactly as you ran it.
      render: text
    validations:
      required: true
  - type: textarea
    id: printed
    attributes:
      label: What Past Forever printed
      render: text
    validations:
      required: true
  - type: textarea
    id: truth
    attributes:
      label: The real answer, and how you know
      description: Working, a script, or a link. For a liar, say how many digits it stays calm.
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name for the Hall of Fame
      description: Your GitHub name is used if you leave this empty.
