name: test
on:
  push:
    branches: [main]   # a PR branch is tested once, by its pull_request run, not twice
  pull_request:
# Read-only token: the tests only need to check out the code.
permissions:
  contents: read
# a new push to the same PR stops its older run instead of queueing behind it
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The checks run as five jobs side by side, same steps as before, so the slowest job (the referee) sets the time.
jobs:
  engine:
    name: the engine, run.js checks, and the page build matches docs/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/run.js
      - run: python3 page/build.py && git diff --exit-code docs/index.html docs/sing.html
  referee:
    name: the referee, 3000 random loops, every answer brute-force checked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/referee.js 3000
  liars:
    name: liars, records, other powers, magnets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: record liars, re-found by a second program and by brute force below 10 million
        run: node tests/liars.js
      - name: liars of other powers (4th-power records vs a brute force below 4 million, 6th and 10th powers, the table)
        run: python3 tests/powers.py
      - name: every calm c sits within k - 2 base-5 digits of one of the four magnets (depths 3 to 1000)
        run: python3 tests/magnets.py
  second-opinion:
    name: second opinion, an independent Python checker re-proves the answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: second opinion (an independent checker in Python re-proves 300 answers, fails on any it can't prove)
        shell: bash
        run: node tests/certify_gen.js 300 2027 | python3 tests/certify.py
      - name: second opinion on every tower x = b ^ x (b = 2..40) and every x = x ^ x (from 2..40)
        shell: bash
        run: node tests/certify_gen.js towers | python3 tests/certify.py
      - name: second opinion on rings in loops that lean on a settled endless number (y = 2 × x − y and friends)
        shell: bash
        run: node tests/certify_gen.js rings2 | python3 tests/certify.py
      - name: second opinion on 400 loops that branch on their last digits (and, or, not)
        shell: bash
        run: node tests/certify_gen.js branch 400 | python3 tests/certify.py
      - name: second opinion on 400 loops with two names
        shell: bash
        run: node tests/certify_gen.js multi 400 | python3 tests/certify.py
      - name: Copilot's three probes, 205 loops, against a plain modular simulation
        run: python3 tests/probes.py
      - name: the ten hand-written certificates (tests/certificates.md), run through the same checker
        shell: bash
        run: node tests/certify_gen.js tests/certificates.jsonl | python3 tests/certify.py
      - name: the certificates page says exactly what the checker and the engine say today
        shell: bash
        run: node tests/certify_gen.js tests/certificates.jsonl | python3 tests/certificates_sync.py
      - name: the checker must fail when it can't prove an answer (it may never quietly pass)
        shell: bash
        run: |
          node tests/certify_gen.js tests/certify_unproved.jsonl > unproved.jsonl   # a generator failure fails here, not as a "pass"
          set +e; out=$(python3 tests/certify.py < unproved.jsonl); rc=$?; set -e; echo "$out"
          [ "$rc" = 1 ] && grep -q '^INCONCLUSIVE' <<< "$out"
      - name: the checker must fail on no input and on an engine crash
        shell: bash
        run: |
          if python3 tests/certify.py < /dev/null; then echo 'passed with no input'; exit 1; fi   # not "! cmd": set -e ignores it
          node tests/certify_gen.js tests/certificates.jsonl > certs.jsonl
          head -1 certs.jsonl | python3 -c "import sys, json; L = json.loads(sys.stdin.read()); L['out'] = 'crash: test'; print(json.dumps(L))" > crash.jsonl
          if python3 tests/certify.py < crash.jsonl; then echo 'passed an engine crash'; exit 1; fi
  browser:
    name: the pages in a real browser, and PARADOX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: the singing roll plays the engine's own digits, a hole on the bar for each note, and fits a phone
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium && node tests/sing.js
      - name: the playground, clicked through on a phone-sized screen
        run: node tests/page.js
      - name: PARADOX (its checks, the experiments, and the audit's brute force against plain Python)
        run: |
          python3 -m venv /tmp/z3 && /tmp/z3/bin/pip install -q z3-solver   # its own venv: the runner's Python refuses pip installs
          /tmp/z3/bin/python paradox/test_paradox.py
          /tmp/z3/bin/python paradox/experiments/check.py
          /tmp/z3/bin/python paradox/audit_2026/check.py
