<!doctype html>
<!-- The link preview picture (docs/og.png, 1280x640). Rebuild: node page/og.js -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
html,body{margin:0}
body{width:1280px;height:640px;background:#0b0e14;color:#e6edf3;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;
 background-image:radial-gradient(ellipse 60% 55% at 62% 50%,rgba(242,193,78,.10),transparent 70%)}
.card{width:1080px;display:flex;flex-direction:column;gap:22px}
.name{font-weight:600;font-size:40px;letter-spacing:.01em}
.name span{color:#f2c14e}
.sum{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:86px;line-height:1;white-space:nowrap;margin-top:18px}
.sum .q{color:#8b95a3}
.sum .dots{color:#5c6673}
.sum .g{color:#f2c14e;text-shadow:0 0 28px rgba(242,193,78,.45)}
.whole{font-size:44px;font-weight:600;color:#e6edf3}
.sub{font-size:31px;font-weight:500;color:#8b95a3;margin-top:22px}
.url{font-family:'JetBrains Mono',monospace;font-size:24px;color:#7aa2f7}
</style></head><body>
<div class="card">
  <div class="name">Past <span>Forever</span></div>
  <div class="sum"><span class="q">1 ÷ 7 = </span><span class="dots">…</span><span class="g">142857</span>143</div>
  <div class="whole">A whole number.</div>
  <div class="sub">Infinite loops that finish with an answer.<br><span class="url">connabyss.github.io/past-forever</span></div>
</div>
</body></html>
